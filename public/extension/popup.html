<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Career Ace Autofill</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 300px;
      margin: 0;
      padding: 16px;
      background: #09090b;
      color: #fafafa;
    }
    h2 {
      font-size: 14px;
      margin: 0 0 4px 0;
      font-weight: 700;
      color: #10b981;
    }
    p {
      font-size: 11px;
      color: #a1a1aa;
      margin: 0 0 12px 0;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 8px 12px;
      border-radius: 6px;
      border: none;
      background: #10b981;
      color: #000;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      text-align: center;
      margin-top: 8px;
    }
    .btn:hover {
      background: #059669;
    }
    .input-group {
      margin-bottom: 8px;
    }
    label {
      font-size: 10px;
      color: #71717a;
      display: block;
      margin-bottom: 2px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      border-radius: 4px;
      border: 1px solid #27272a;
      background: #18181b;
      color: #fff;
      font-size: 11px;
    }
    .status {
      font-size: 10px;
      margin-top: 8px;
      text-align: center;
      color: #10b981;
    }
  </style>
</head>
<body>
  <h2>Career Ace ATS Copilot</h2>
  <p>Auto-fill Greenhouse, Lever &amp; Workday applications with 1 click.</p>

  <div class="input-group">
    <label>Full Name</label>
    <input type="text" id="name" placeholder="Alex Rivera">
  </div>
  <div class="input-group">
    <label>Email</label>
    <input type="email" id="email" placeholder="alex@example.com">
  </div>
  <div class="input-group">
    <label>Phone</label>
    <input type="tel" id="phone" placeholder="+1 (555) 000-0000">
  </div>
  <div class="input-group">
    <label>LinkedIn / Portfolio URL</label>
    <input type="url" id="linkedin" placeholder="https://linkedin.com/in/...">
  </div>

  <button class="btn" id="fillBtn">Auto-Fill This Page</button>
  <div class="status" id="statusMsg"></div>

  <script src="popup.js"></script>
</body>
</html>
